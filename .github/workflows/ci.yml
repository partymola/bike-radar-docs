name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Run reference-decoder tests
        run: cd python && python -m pytest tests/ -v

  kotlin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Kotlin compiler
        run: |
          curl -sSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q kotlin.zip
          echo "$PWD/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Fetch JUnit
        run: |
          curl -sSL -o junit.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSL -o hamcrest.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
      - name: Compile and run reference-decoder tests
        run: |
          kotlinc kotlin/Model.kt kotlin/RadarV2Decoder.kt kotlin/RadarV1Decoder.kt kotlin/test/*.kt \
            -cp junit.jar:hamcrest.jar -include-runtime -d tests.jar
          java -cp tests.jar:junit.jar:hamcrest.jar org.junit.runner.JUnitCore \
            es.jjrh.bikeradar.RadarV2DecoderTest es.jjrh.bikeradar.RadarV1DecoderTest
